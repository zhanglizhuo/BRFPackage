description: >
  Curated collection of group-aware benchmark datasets across education,
  engineering, transportation, energy, healthcare, finance, environmental,
  business, sports, and fitness domains with standardized metadata,
  reproducibility scripts, and BRF (Benchmark Reliability Framework)
  audit results. v2.1 expands from 35 to 51 datasets. All source modules
  are self-contained.

