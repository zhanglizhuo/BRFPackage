[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-reliability"
version = "0.3.2"
description = "Benchmark Reliability Framework (BRF) - dataset-level reliability auditing with built-in benchmark registry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "zhanglizhuo", email = "zhanglizhuo@gmail.com" },
]
keywords = ["benchmark reliability", "dataset auditing", "educational AI", "machine learning", "registry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "pandas>=1.1",
    "scipy>=1.5",
    "openml>=0.12",
]

# Seven of the 51 datasets need a reader that is not part of the core stack:
# kagglehub for 5 Kaggle-hosted sources, pyreadstat for the PISA 2015 .sav
# files, openpyxl for the Taiwan .xlsx files. They are optional rather than
# required because pyreadstat needs the system-level libreadstat, which would
# otherwise be imposed on every install for the sake of 44 datasets.
# pyreadstat also needs libreadstat present on the system, e.g.
#   Debian/Ubuntu: apt-get install libreadstat-dev
#   macOS:         brew install readstat
[project.optional-dependencies]
full = [
    "kagglehub>=0.1",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
]

[project.scripts]
brf = "brf.cli:main"

[project.urls]
Homepage = "https://github.com/zhanglizhuo/BRFPackage"
Repository = "https://github.com/zhanglizhuo/BRFPackage"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["brf", "brf.metrics", "brf.phase", "brf.registry", "brf.registry.sources", "brf.report"]

[tool.setuptools.package-data]
"brf.registry" = ["manifest.yaml", "registry_v2.1.json", "prepare_hashes.json",
                    "taxonomy.yaml", "version_policy.yaml", "cards/*.yaml"]

[tool.setuptools.exclude-package-data]
"brf.registry" = ["cache/*", "cache/**/*"]
